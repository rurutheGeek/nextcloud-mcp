name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Tests and container build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Syntax check
        run: python3 -m py_compile nextcloud_mcp.py
      - name: Unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Build the container
        run: docker build -t nextcloud-mcp:ci .
